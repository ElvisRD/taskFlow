<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow - Gestor de tableros y tareas" />
    <title>TaskFlow</title>
    <script>
      // Apply the theme before paint to avoid a flash of light mode.
      (() => {
        try {
          const stored = localStorage.getItem('taskflow-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark)
          const root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          // No localStorage access: fall back to the light theme.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
